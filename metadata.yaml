name: astrbot_plugin_conversation_opener
display_name: 群会话开启助手
desc: 列出机器人加入的全部群聊，标出哪些群还没有活跃对话；在插件页面里勾选即可为这些群开启会话，也可以关闭已有会话，让主动回复只在想要的群里工作。
short_desc: 查看哪些群还没开启会话，勾选一键开启/关闭
help: 在插件页打开本插件，进入「groups」视图：未开启会话的群排在前面。勾选未开启的群点「开启」即可补建对话；勾选已开启的群点「关闭」（需二次确认）会删掉该群当前对话。
version: v1.1.0
author: bhdhdjdjzjizi-arch
repo: "https://github.com/bhdhdjdjzjizi-arch/astrbot_plugin_conversation_opener"
astrbot_version: ">=4.16,<5"
